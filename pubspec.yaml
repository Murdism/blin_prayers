name: Shiwan
description: "Blin (ብሊን) prayers, hymns and catechism in Ge'ez script for offline prayer and catechesis."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data.json
    - assets/images/source_2026/
    - assets/images/source_2026/provenance/
    - assets/images/way_of_cross_2025/
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
    - family: NotoSerifEthiopic
      fonts:
        - asset: assets/fonts/NotoSerifEthiopic.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
